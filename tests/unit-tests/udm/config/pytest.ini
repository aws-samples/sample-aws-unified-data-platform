[tool:pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short
    --cov=src/glue/udm
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:udm_cov_report.xml
    --cov-fail-under=90
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning